---
apiVersion: v1
kind: Pod
metadata:
  name: root-uid-test-sec
  namespace: audit-zone
  labels:
    test: audit-security
spec:
  containers:
    - name: test
      image: busybox:latest
      command: ["sleep", "3600"]
      securityContext:
        runAsUser: 1000                 # Было: 0
        runAsNonRoot: true              # Было: false
        allowPrivilegeEscalation: false # Было: не указано
        capabilities:
          drop: ["ALL"]                 # Было: не указано
        seccompProfile:
          type: RuntimeDefault          # Было: не указано
  restartPolicy: Never
