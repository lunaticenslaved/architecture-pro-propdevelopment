apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8snoroot
  annotations:
    description: "Требует runAsNonRoot: true и запрещает runAsUser: 0"
spec:
  crd:
    spec:
      names:
        kind: K8sNoRoot
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8snoroot

        # runAsNonRoot не указан или != true
        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          not container.securityContext.runAsNonRoot == true
          msg := sprintf("runAsNonRoot должен быть true (container: %v)", [container.name])
        }

        # runAsUser явно равен 0
        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          container.securityContext.runAsUser == 0
          msg := sprintf("runAsUser=0 (root) запрещён (container: %v)", [container.name])
        }
